# Render.com 自动部署配置文件
# 放置在项目根目录，Render会自动识别并配置部署
services:
  - type: web
    name: campus-lost-found-backend
    env: java
    repo: https://github.com/achelie/lost_found.git
    branch: main
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/lost-found-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: campusLostFoundSecretKey2024CampusLostFoundPlatform
      - key: UPLOAD_PATH
        value: /tmp/uploads/
    autoDeploy: true

databases:
  - name: campus-lost-found-db
    databaseName: campus_lost_found
    user: admin
    plan: free
    region: singapore